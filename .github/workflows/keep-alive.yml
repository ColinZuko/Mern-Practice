# Keeps the free Render backend awake: Render puts it to sleep after 15 minutes
# without traffic, so this pings it every 10 minutes. If the backend is down the
# run fails, and GitHub emails you about the failed run.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend
        run: |
          # A sleeping instance can take up to a minute to wake, so allow time and retry
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
            https://mern-blog-backend-blt0.onrender.com/health
